name: Flutter Lint & Format

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze lib/

      - name: Format check
        run: flutter format --set-exit-if-changed --output=none lib/
